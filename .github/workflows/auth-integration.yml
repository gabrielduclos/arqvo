name: Better Auth PostgreSQL integration

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'docs/database/002_better_auth.sql'
      - '.github/workflows/auth-integration.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docs/database/002_better_auth.sql'
      - '.github/workflows/auth-integration.yml'

jobs:
  auth-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arqvo_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arqvo_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/arqvo_auth_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
